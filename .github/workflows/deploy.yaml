name: Build and Deploy

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    # 1. Login to Docker Hub
    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # 2. Build and Push Image
    - name: Build and Push
      run: |
        # Use commit hash as tag
        SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
        IMAGE_ID=${{ secrets.DOCKER_USERNAME }}/fraud-engine
        
        docker build -t $IMAGE_ID:$SHORT_SHA .
        docker push $IMAGE_ID:$SHORT_SHA

    # 3. Update Kubernetes Manifest (GitOps)
    - name: Update Kubernetes Manifest
      run: |
        SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
        IMAGE_ID=${{ secrets.DOCKER_USERNAME }}/fraud-engine
        
        # Update k8s/app.yaml with new tag
        sed -i "s|image: .*|image: $IMAGE_ID:$SHORT_SHA|g" k8s/app.yaml
        
        # Commit back to repo
        git config --global user.name 'GitHub Actions'
        git config --global user.email 'actions@github.com'
        git add k8s/app.yaml
        git commit -m "Update image to $SHORT_SHA"
        git push